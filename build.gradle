plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'nl.tnk'
version = '1.2'
base.archivesName = 'combat-punchy'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url = 'https://maven.creeperhost.net'
        content {
            includeGroupByRegex 'net\\.minecraftforge.*'
            includeGroupByRegex 'org\\.spongepowered.*'
            includeGroup 'cpw.mods'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { combatpunchy { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'combatpunchy.refmap.json'
    config 'combatpunchy.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'
    // Minecraft supplies this at runtime; the face-transform API uses it directly.
    compileOnly 'org.joml:joml:1.10.5'
    testImplementation 'org.joml:joml:1.10.5'
    implementation fg.deobf('maven.modrinth:vu3NZ5Ma:KEBfkBat')
    compileOnly fg.deobf('maven.modrinth:mzgtK8pY:q0vE6iEZ')
    runtimeOnly fg.deobf('maven.modrinth:mzgtK8pY:q0vE6iEZ')
    runtimeOnly fg.deobf('maven.modrinth:8aoMKplv:DdPbuBDy')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '[0.5.0,0.6)') {
        jarJar.pin(it, '0.5.0')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveClassifier = 'slim'
    manifest.attributes('Implementation-Title': 'Combat Punchy', 'Implementation-Version': project.version, 'MixinConfigs': 'combatpunchy.mixins.json')
    finalizedBy 'reobfJar'
}

// The policy checks below are executable test mains rather than JUnit tests.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.register('verifyTransitions', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.tnk.combatpunchy.ModeSessionTest'
}

tasks.named('check') { dependsOn verifyTransitions }

tasks.register('verifyHandHandoff', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.tnk.combatpunchy.FirstPersonHandoffTest'
}

tasks.named('check') { dependsOn verifyHandHandoff }

tasks.register('verifyCombatTimeout', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.tnk.combatpunchy.CombatIdleTimeoutTest'
}

tasks.named('check') { dependsOn verifyCombatTimeout }

tasks.register('verifyMovesFaces', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.tnk.combatpunchy.MovesFaceTransformTest'
}

tasks.named('check') { dependsOn verifyMovesFaces }

jarJar.enable()
tasks.named("build") { dependsOn "jarJar" }
tasks.named("jarJar") { archiveClassifier = "forge-1.20.1" }
reobf { jarJar {} }
tasks.named("jarJar") { finalizedBy "reobfJarJar" }
