name: Clean up source branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-branch-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update wiki links and remove redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com

          leases=()
          deletions=()
          while read -r old expected kept; do
            old_ref="refs/heads/$old"
            test "$(git rev-parse "refs/remotes/origin/$old")" = "$expected"
            git merge-base --is-ancestor "$expected" "refs/remotes/origin/$kept"
            leases+=("--force-with-lease=$old_ref:$expected")
            deletions+=(":$old_ref")
          done <<'BRANCHES'
          fix/combat-responsiveness-1.3.3-forge 5b2acc47982d376cb2eddb54ce56d7e812fcc35f forge-1.20.1
          fix/combat-responsiveness-1.3.3-neoforge a9e2d12fca0db04b35427c6c693b13f3f6c4a58c neoforge-1.21.1
          fix/moves-fml-1.3.4-forge 4f121ac5fa7e175288f7cf3155a811abb3d35435 forge-1.20.1
          fix/moves-fml-1.3.4-neoforge b3027cdee726b07d14628041afee37213b13ba8f neoforge-1.21.1
          fix/weapons-mining-1.3.5-forge 9932b069d0b19927e8530f6cad7fccf9a39a2704 forge-1.20.1
          fix/weapons-mining-1.3.5-forge-complete 9932b069d0b19927e8530f6cad7fccf9a39a2704 forge-1.20.1
          fix/weapons-mining-1.3.5-neoforge 99136ba37abf0cd738cd0246ab690ffb4b70fe2c neoforge-1.21.1
          fix/weapons-mining-1.3.5-neoforge-complete 03985e8e1cf6259220f8808beee6eeae7b36ec6a neoforge-1.21.1
          port/forge-1.20.1 d6340fbc609df5da260a7aa8e627d1c9020e836c forge-1.20.1
          BRANCHES

          wiki_dir="$RUNNER_TEMP/project-wiki"
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki_dir"
          test "$(git -C "$wiki_dir" rev-parse HEAD)" = 'be1d8f31678e023aaab5ba929340f88c57e813c6'
          cp wiki/Home.md wiki/_Sidebar.md "$wiki_dir/"
          git -C "$wiki_dir" add -- Home.md _Sidebar.md
          git -C "$wiki_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update Forge and NeoForge source links'
          git -C "$wiki_dir" push origin HEAD

          git push --atomic "${leases[@]}" origin "${deletions[@]}"
