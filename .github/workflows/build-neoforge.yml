name: Build NeoForge JAR
run-name: build Combat Punchy ${{ inputs.version }} NeoForge-1.21.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in the NeoForge source branch
        required: true
        type: string
        default: '1.3.5'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-jar.yml
    with:
      source-ref: neoforge-1.21.1
      target: neoforge-1.21.1
      java-version: '21'
      version: ${{ inputs.version }}
