name: Build NeoForge JAR
run-name: build Combat Punchy ${{ inputs.version || '1.3.5' }} NeoForge-1.21.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-neoforge.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version in the NeoForge source branch
        required: true
        type: string
        default: '1.3.5'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-jar.yml
    with:
      source-ref: ${{ github.event_name == 'push' && '99136ba37abf0cd738cd0246ab690ffb4b70fe2c' || 'neoforge-1.21.1' }}
      target: neoforge-1.21.1
      java-version: '21'
      version: ${{ inputs.version || '1.3.5' }}
