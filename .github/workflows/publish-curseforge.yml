name: Publish verified JARs to CurseForge
run-name: build Combat Punchy ${{ inputs.version || '1.3.6' }} ${{ inputs.target || 'NeoForge-1.21.1' }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-curseforge.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Existing verified release to publish
        required: true
        default: '1.3.5'
      target:
        description: Release loader and Minecraft version
        type: choice
        required: true
        options:
          - NeoForge-1.21.1
          - Forge-1.20.1
permissions:
  contents: read
concurrency:
  group: combat-punchy-curseforge
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish Combat Punchy 1.3.6 NeoForge-1.21.1 to CurseForge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || '1.3.6' }}
          RELEASE_TARGET: ${{ inputs.target || 'NeoForge-1.21.1' }}
        run: python3 .github/scripts/publish_curseforge.py
      - name: upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curseforge-upload-results-${{ inputs.target || 'NeoForge-1.21.1' }}
          path: curseforge-upload-results.json
          if-no-files-found: ignore
