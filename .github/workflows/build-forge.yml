name: Build Forge JAR
run-name: build Combat Punchy ${{ inputs.version }} Forge-1.20.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in the Forge source branch
        required: true
        type: string
        default: '1.3.5'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-jar.yml
    with:
      source-ref: forge-1.20.1
      target: forge-1.20.1
      java-version: '17'
      version: ${{ inputs.version }}
