name: Build Forge JAR
run-name: build Combat Punchy ${{ inputs.version || '1.3.5' }} Forge-1.20.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-forge.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version in the Forge source branch
        required: true
        type: string
        default: '1.3.5'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-jar.yml
    with:
      source-ref: ${{ github.event_name == 'push' && '9932b069d0b19927e8530f6cad7fccf9a39a2704' || 'forge-1.20.1' }}
      target: forge-1.20.1
      java-version: '17'
      version: ${{ inputs.version || '1.3.5' }}
