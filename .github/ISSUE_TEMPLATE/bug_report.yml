name: Bug report
description: Report a problem with Combat Punchy.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please check the [known issues](https://github.com/Mikaaah/Combat-Punchy/wiki/Known-Issues) and existing reports first. For the known Moves facial issue, add details to issue #1."
  - type: checkboxes
    id: existing_reports
    attributes:
      label: Existing reports
      options:
        - label: I searched the existing issues and this is a different problem.
          required: true
  - type: input
    id: version
    attributes:
      label: Combat Punchy version
      placeholder: "1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Minecraft, NeoForge and companion mod versions
      description: Include Epic Fight, Punchy, Punchy! Moves and WOM when present. Write "not present" for optional mods you do not use.
      placeholder: "Minecraft:\nNeoForge:\nEpic Fight:\nPunchy:\nPunchy! Moves:\nWOM:"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected behavior
      options:
        - Automatic combat entry or exit
        - Inactivity timer
        - First-person hands or stances
        - Third-person animation
        - Camera or targeting
        - Weapon detection
        - Crash or loading
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how can it be reproduced?
      description: Include the weapon/item, action, perspective and relevant config changes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or video
      description: Attach the relevant client log or crash report and visual evidence if applicable. Remove personal information and secrets.
  - type: textarea
    id: other_mods
    attributes:
      label: Other animation, player-model, camera or shader mods
